name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run full-verification

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run generate:version
      - run: bun run check:release-version
      - run: bun run typecheck
      - run: bun run check:literal-imports
      - run: bun run check:runtime-assets
      - run: MANAS_RELEASE_TAG="${GITHUB_REF_NAME}" MANAS_RELEASE_TARGET="${{ matrix.target }}" bun run build:release
      - name: Apply and verify ad-hoc signature
        run: |
          ARTIFACT="dist/manas-${{ matrix.target }}"
          codesign --force --sign - "$ARTIFACT"
          codesign --verify --strict --verbose=2 "$ARTIFACT"
          if [ "${{ matrix.target }}" = "darwin-arm64" ]; then lipo -archs "$ARTIFACT" | grep -qx arm64; else lipo -archs "$ARTIFACT" | grep -qx x86_64; fi
      - name: Verify the standalone binary from a fresh home
        run: |
          FRESH_HOME="$(mktemp -d)"
          export HOME="$FRESH_HOME"
          cd "$FRESH_HOME"
          "$GITHUB_WORKSPACE/dist/manas-${{ matrix.target }}" --version
          "$GITHUB_WORKSPACE/dist/manas-${{ matrix.target }}" setup --detect-only --allow-empty --json
      - name: Package unsigned release
        run: |
          ARTIFACT="dist/manas-${{ matrix.target }}"
          codesign --verify --strict --verbose=2 "$ARTIFACT"
          mkdir "dist/package"
          cp "$ARTIFACT" "dist/package/manas"
          cp LICENSE "dist/package/LICENSE"
          printf '%s\n' "${GITHUB_REF_NAME#v}" > "dist/package/VERSION"
          printf '%s\n' "target=${{ matrix.target }}" "signing=ad-hoc" "notarized=false" "sha256=$(shasum -a 256 "$ARTIFACT" | awk '{print $1}')" > "dist/package/BUILD_METADATA"
          chmod 755 "dist/package/manas"
          (
            cd dist/package
            zip -r "manas-${{ matrix.target }}.zip" manas LICENSE VERSION BUILD_METADATA
            mv "manas-${{ matrix.target }}.zip" ..
          )
          UNPACKED="$RUNNER_TEMP/manas-${{ matrix.target }}"
          mkdir "$UNPACKED"
          unzip -q "dist/manas-${{ matrix.target }}.zip" -d "$UNPACKED"
          (
            cd "$UNPACKED"
            test -x manas
            cmp "$GITHUB_WORKSPACE/$ARTIFACT" manas
          )
          shasum -a 256 "dist/manas-${{ matrix.target }}.zip" > "dist/SHA256SUMS"
      - name: Normalize per-architecture checksum manifest
        run: |
          (cd dist && shasum -a 256 "manas-${{ matrix.target }}.zip" > SHA256SUMS)
      - name: Attest release package and checksum
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/manas-${{ matrix.target }}.zip
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manas-release-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manas-release-${{ github.ref_name }}-darwin-arm64
          path: release/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: manas-release-${{ github.ref_name }}-darwin-x64
          path: release/darwin-x64
      - run: |
          cp release/darwin-arm64/manas-darwin-arm64.zip release/manas-darwin-arm64.zip
          cp release/darwin-x64/manas-darwin-x64.zip release/manas-darwin-x64.zip
          (cd release && shasum -a 256 manas-darwin-arm64.zip manas-darwin-x64.zip > SHA256SUMS)
          (cd release && shasum -a 256 -c SHA256SUMS)
      - name: Require and verify every native artifact
        run: |
          separator=$(printf '\057')
          for target in darwin-arm64 darwin-x64; do
            directory="release${separator}${target}"
            zip="manas-${target}.zip"
            test -s "${directory}${separator}${zip}"
            test -s "${directory}${separator}SHA256SUMS"
            (cd "$directory" && shasum -a 256 -c SHA256SUMS)
          done
      - run: gh release create "${GITHUB_REF_NAME}" release/manas-darwin-arm64.zip release/manas-darwin-x64.zip release/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --title "Manas ${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
